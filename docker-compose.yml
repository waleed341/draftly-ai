services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: draftly
      POSTGRES_USER: draftly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftly -d draftly"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    ports: ["8000:8000"]
    environment:
      DRAFTLY_DATABASE_URL: postgresql+asyncpg://draftly:${POSTGRES_PASSWORD}@postgres:5432/draftly
      DRAFTLY_REDIS_URL: redis://redis:6379/0
      DRAFTLY_LLM_MODEL: ${DRAFTLY_LLM_MODEL:-ollama:gemma4:31b-cloud}
      DRAFTLY_LLM_BASE_URL: ${DRAFTLY_LLM_BASE_URL:-http://host.docker.internal:11434}
      DRAFTLY_CORS_ORIGINS: '${DRAFTLY_CORS_ORIGINS:-["http://localhost:3000"]}'
      DRAFTLY_FRONTEND_URL: ${DRAFTLY_FRONTEND_URL:-http://localhost:3000}
      DRAFTLY_GOOGLE_CLIENT_ID: ${DRAFTLY_GOOGLE_CLIENT_ID:-}
      DRAFTLY_GOOGLE_CLIENT_SECRET: ${DRAFTLY_GOOGLE_CLIENT_SECRET:-}
      DRAFTLY_GMAIL_TOKEN_KEY: ${DRAFTLY_GMAIL_TOKEN_KEY:-}
      DRAFTLY_GOOGLE_REDIRECT_URI: ${DRAFTLY_GOOGLE_REDIRECT_URI:-http://localhost:8000/api/gmail/callback}
      DRAFTLY_SUPER_ADMIN_EMAIL: ${DRAFTLY_SUPER_ADMIN_EMAIL:-}
      DRAFTLY_COOKIE_SECURE: ${DRAFTLY_COOKIE_SECURE:-false}
      DRAFTLY_REGISTRATION_OPEN: ${DRAFTLY_REGISTRATION_OPEN:-true}
      DRAFTLY_EMAIL_VERIFICATION_SECRET: ${DRAFTLY_EMAIL_VERIFICATION_SECRET:-}
      DRAFTLY_EMAIL_SMTP_HOST: ${DRAFTLY_EMAIL_SMTP_HOST:-}
      DRAFTLY_EMAIL_SMTP_PORT: ${DRAFTLY_EMAIL_SMTP_PORT:-587}
      DRAFTLY_EMAIL_SMTP_USERNAME: ${DRAFTLY_EMAIL_SMTP_USERNAME:-}
      DRAFTLY_EMAIL_SMTP_PASSWORD: ${DRAFTLY_EMAIL_SMTP_PASSWORD:-}
      DRAFTLY_EMAIL_SMTP_FROM: ${DRAFTLY_EMAIL_SMTP_FROM:-}
      DRAFTLY_EMAIL_SMTP_USE_SSL: ${DRAFTLY_EMAIL_SMTP_USE_SSL:-false}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["draftly-data:/legacy-data:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./api
    command: ["celery", "-A", "app.worker:celery", "worker", "--loglevel=INFO"]
    environment:
      DRAFTLY_DATABASE_URL: postgresql+asyncpg://draftly:${POSTGRES_PASSWORD}@postgres:5432/draftly
      DRAFTLY_REDIS_URL: redis://redis:6379/0
      DRAFTLY_GOOGLE_CLIENT_ID: ${DRAFTLY_GOOGLE_CLIENT_ID:-}
      DRAFTLY_GOOGLE_CLIENT_SECRET: ${DRAFTLY_GOOGLE_CLIENT_SECRET:-}
      DRAFTLY_GMAIL_TOKEN_KEY: ${DRAFTLY_GMAIL_TOKEN_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
  scheduler:
    build: ./api
    command: ["celery", "-A", "app.worker:celery", "beat", "--loglevel=INFO"]
    environment:
      DRAFTLY_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  draftly-data:
  postgres-data:
  redis-data:
