[project]
name = "draftly-api"
version = "0.1.0"
description = "Timezone-aware AI email drafting API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "langchain>=1.0,<2",
    "langchain-ollama>=0.3,<1",
    "pydantic-settings>=2.5,<3",
    "tzdata>=2024.1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "alembic>=1.13,<2",
    "pwdlib[argon2]>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "google-api-python-client>=2.150,<3",
    "cryptography>=43,<47",
    "celery[redis]>=5.4,<6",
    "email-validator>=2.2,<3",
    "asyncpg>=0.29,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["B008"]
